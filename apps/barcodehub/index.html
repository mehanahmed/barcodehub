<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111b15" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO: the server replaces everything between seo:start and seo:end per route (src/server/seoHtml.ts) -->
    <!-- seo:start -->
    <title>BarcodeHub — Barcode Generator &amp; Product Registry</title>
    <meta name="description" content="Generate EAN-13, UPC-A, and Code 128 barcodes. Publish your product details so Google, barcode scanners, and customers can find them instantly." />
    <link rel="canonical" href="https://barcodehub.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BarcodeHub" />
    <meta property="og:title" content="BarcodeHub — Barcode Generator &amp; Product Registry" />
    <meta property="og:description" content="Generate EAN-13, UPC-A, and Code 128 barcodes. Publish your product details so Google, barcode scanners, and customers can find them instantly." />
    <meta property="og:url" content="https://barcodehub.com/" />
    <meta property="og:image" content="https://barcodehub.com/barcode_products_showcase.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BarcodeHub — Barcode Generator &amp; Product Registry" />
    <meta name="twitter:description" content="Generate EAN-13, UPC-A, and Code 128 barcodes. Publish your product details so Google, barcode scanners, and customers can find them instantly." />
    <meta name="twitter:image" content="https://barcodehub.com/barcode_products_showcase.jpg" />
    <!-- seo:end -->

    <!-- Sitemap hint for crawlers that read HTML -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
